<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>G-Engine — গেম ইঞ্জিন</title>
  <link rel="preload" href="fonts/hind-siliguri-bengali-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo" aria-hidden="true">G</span>
      <div>
        <h1>G-Engine</h1>
        <p data-t="tagline"></p>
      </div>
    </div>
    <div class="tools">
      <button id="project-name" class="chip strong" type="button" data-t="projects"></button>
      <button id="save-game" class="chip" type="button" data-t="saveGame"></button>
      <button id="play-toggle" class="chip play" type="button" data-t="play"></button>
      <button id="lang" class="chip" type="button"></button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="screen" id="screen">
        <canvas id="canvas" tabindex="0"></canvas>
        <div class="hud">
          <div class="pill"><span class="coin" aria-hidden="true"></span><span data-t="score"></span> <b id="score"></b></div>
          <div class="pill dim" id="fps"></div>
        </div>
        <div id="bubbles"></div>
        <div class="overlay" id="overlay" hidden>
          <div class="card">
            <h2 id="overlay-title"></h2>
            <button id="again" class="primary" type="button" data-t="again"></button>
          </div>
        </div>
        <div class="message" id="message"></div>
      </div>

      <div class="pad" id="pad">
        <div class="cluster">
          <button type="button" data-button="left" data-label="left">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4.5 7 12l8.5 7.5z"/></svg>
          </button>
          <button type="button" data-button="right" data-label="right">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4.5 17 12l-8.5 7.5z"/></svg>
          </button>
        </div>
        <p class="keys" data-t="keys"></p>
        <div class="cluster">
          <button type="button" data-button="action" data-label="action" class="small">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.2L21 10l-5 4.3L17.6 21 12 17.3 6.4 21 8 14.3 3 10l6.5-.8z"/></svg>
          </button>
          <button type="button" data-button="jump" data-label="jump" class="wide" data-t="jump"></button>
        </div>
      </div>

      <div class="options">
        <label class="switch"><input type="checkbox" id="opt-light" checked><span data-t="lighting"></span></label>
        <label class="switch"><input type="checkbox" id="opt-bloom" checked><span data-t="bloom"></span></label>
        <button id="restart" class="chip" type="button" data-t="restart"></button>
        <span id="stats" class="stats"></span>
      </div>
    </section>

    <section class="editor">
      <h2 data-t="editorTitle"></h2>
      <p class="lead" data-t="editorLead"></p>

      <div class="project" id="project">
        <button id="new-game" class="chip" type="button" data-t="newGame"></button>
        <button id="sample-game" class="chip" type="button" data-t="loadSample"></button>
        <button id="export-game" class="chip" type="button" data-t="exportGame"></button>
        <button id="import-game" class="chip" type="button" data-t="importGame"></button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
        <span id="toast" class="toast" role="status"></span>
      </div>

      <div class="panels" role="tablist">
        <button id="panel-level" class="panel-tab" type="button" role="tab" data-t="sceneTab"></button>
        <button id="panel-behavior" class="panel-tab" type="button" role="tab" data-t="behaviorTab"></button>
        <button id="panel-play" class="panel-tab" type="button" role="tab" data-t="playTab"></button>
      </div>

      <div id="level-panel">
        <p class="lead" data-t="sceneLead"></p>
        <div class="palette" id="palette"></div>
        <div class="grid-wrap"><div id="level-grid" class="level-grid"></div></div>
        <div id="inspector" class="inspector" hidden></div>
        <details class="raw">
          <summary data-t="levelText"></summary>
          <textarea id="level-text" rows="6" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
          <p class="hint" data-t="levelHint"></p>
        </details>
      </div>

      <div id="behavior-panel" hidden>
        <div class="tabs" id="tabs" role="tablist"></div>
        <textarea id="code" rows="8" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>

        <div class="actions">
          <button id="run" class="primary" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z"/></svg><span data-t="run"></span>
          </button>
          <button id="reset" class="ghost" type="button" data-t="reset"></button>
          <span id="status" class="status" role="status"></span>
        </div>

        <h3 data-t="understood"></h3>
        <ol id="notes" class="notes"></ol>

        <h3 data-t="tryThese"></h3>
        <div id="examples" class="examples"></div>
      </div>

      <div id="play-panel" hidden>
        <p class="lead" data-t="playLead"></p>
        <div class="play-box">
          <button id="play-big" class="primary" type="button" data-t="play"></button>
          <button id="stop-big" class="ghost" type="button" data-t="stop"></button>
        </div>
        <p class="hint" data-t="playHint"></p>
      </div>
    </section>
  </main>

  <div id="projects-sheet" class="sheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true">
      <h2 data-t="projects"></h2>
      <div id="projects-list" class="projects-list"></div>
      <div class="actions">
        <button id="project-new" class="primary" type="button" data-t="newGame"></button>
        <button id="project-rename" class="ghost" type="button" data-t="rename"></button>
        <button id="projects-close" class="ghost" type="button" data-t="close"></button>
      </div>
    </div>
  </div>

  <footer>
    <p data-t="footer"></p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
