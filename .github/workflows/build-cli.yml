name: build-cli

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:      # called by release.yml on tag pushes

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ cmake xvfb libgl-dev libegl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev \
            libxkbcommon-dev libxfixes-dev libxtst-dev libasound2-dev

      - name: Cache CMake FetchContent downloads
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('tests/CMakeLists.txt', 'CMakeLists.txt') }}

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee configure.log

      - name: Upload configure diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: configure-diagnostics
          path: |
            configure.log
            build/CMakeFiles/*.log
            build/CMakeFiles/CMakeError.log
            build/CMakeFiles/CMakeOutput.log
          if-no-files-found: warn

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Headless smoke test (player renders 120 frames under Xvfb)
        run: xvfb-run -a ./build/player/lumen_player --frames 120

      - name: Package CLI for download
        run: |
          mkdir -p dist
          cp build/agentkit/lumen dist/lumen
          tar -C dist -czf lumen-cli-linux-x86_64.tar.gz lumen
          sha256sum lumen-cli-linux-x86_64.tar.gz > lumen-cli-linux-x86_64.tar.gz.sha256

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-cli-linux-x86_64
          path: |
            lumen-cli-linux-x86_64.tar.gz
            lumen-cli-linux-x86_64.tar.gz.sha256

      - name: Upload player artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumen-player-linux
          path: build/player/lumen_player
